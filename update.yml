name: Update prices
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_prices.py
      - run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
